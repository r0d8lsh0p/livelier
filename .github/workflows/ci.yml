name: CI

on:
  push:
  workflow_dispatch:

jobs:
  bridge:
    name: Bridge — typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # --runInBand: the suite occasionally SIGSEGVs a jest worker during
      # teardown; a single in-band process sidesteps worker lifecycle entirely.
      - run: npm test -w packages/bridge -- --runInBand

  site:
    name: Site — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
